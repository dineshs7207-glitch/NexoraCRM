project_id = "nexora-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://dineshs7207-glitch.github.io/NexoraCRM/**"]
jwt_expiry = 900
enable_signup = true

# Invite-only: sign-up stays on so invitees can use Google, but only invited users get a profile.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

# Checks the caller itself with @supabase/server; the platform check only understands legacy JWT keys.
[functions.invite-user]
verify_jwt = false
